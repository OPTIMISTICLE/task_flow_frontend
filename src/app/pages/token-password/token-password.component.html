<main class="identity-page">
  <app-theme-toggle />
  <form class="identity-card" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">TaskFlow security</p>
    <h1>{{ mode === 'invitation' ? 'Activate your account' : 'Choose a new password' }}</h1>
    <p>Use at least 15 characters. Spaces and passphrases are welcome.</p>
    @if (error()) { <div class="alert error" role="alert">{{ error() }}</div> }
    @if (success()) {
      <div class="alert success" role="status">{{ success() }}</div>
      <a class="primary-button full" routerLink="/login">Continue to sign in</a>
    } @else {
      <label>New password<input type="password" formControlName="password" autocomplete="new-password" /></label>
      <label>Confirm password<input type="password" formControlName="confirmation" autocomplete="new-password" /></label>
      <button class="primary-button full" [disabled]="loading()">
        {{ loading() ? 'Saving…' : mode === 'invitation' ? 'Activate account' : 'Reset password' }}
      </button>
    }
  </form>
</main>

<main class="identity-page">
  <app-theme-toggle />
  <form class="identity-card" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">Account recovery</p><h1>Reset your password</h1>
    <p>We will email a 30-minute recovery link if the account exists.</p>
    @if (error()) { <div class="alert error">{{ error() }}</div> }
    @if (success()) { <div class="alert success">{{ success() }}</div> }
    <label>Email<input type="email" formControlName="email" autocomplete="email" /></label>
    <button class="primary-button full" [disabled]="loading()">{{ loading() ? 'Sending…' : 'Send recovery link' }}</button>
    <a class="back-link" routerLink="/login">← Back to sign in</a>
  </form>
</main>
